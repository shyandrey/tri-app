# Prepared Preview pipeline. Deployment is disabled until separate owner activation.
name: Preview CI
on:
  pull_request:
    branches: [preview]
  push:
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    # PR merge candidates and preview only; manual runs on other refs are skipped.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/preview'
    name: Portable verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.package_upload.outputs.artifact-id }}
      manifest_digest: ${{ steps.package.outputs.manifest_digest }}
    steps:
      - name: Initialize CI report directory
        shell: bash
        run: |
          echo "CI_REPORT_DIR=$RUNNER_TEMP/portable-ci" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/portable-ci"
      - name: Checkout exact event SHA (PR merge candidate or dispatch SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Feedback release test compares the original migration in Git history.
          fetch-depth: 0
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify checkout and toolchain
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = 'v24.19.0'
          node --version
          npm --version
          python3 --version
          python3 -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
          git cat-file -e b511238210cba253bd4b90b6b9fdf8b2b2611a9d:migrations/0001_feedback_news.sql
          mkdir -p "$CI_REPORT_DIR"
      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$CI_REPORT_DIR/npm-ci.log"
      - name: Portable tests, build, lint and unchanged release gate
        run: node scripts/check-ci-portable.mjs
      - name: Preview pipeline safety tests
        run: node --test scripts/test-preview-pipeline.mjs
      - name: Package the verified build without rebuilding
        id: package
        run: node scripts/preview-artifact.mjs prepare "${{ runner.temp }}/preview-package" "$GITHUB_SHA"
      - name: Retain immutable Preview package
        id: package_upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-package/
          if-no-files-found: error
          retention-days: 30
          # Only dist/.assetsignore is allowed by the package verifier.
          include-hidden-files: true
      - name: Record job outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          printf '\nJob status: %s\n\nEvent SHA: `%s`\n' "$JOB_STATUS" "$CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portable-ci/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false

  browser:
    name: Browser verification
    needs: portable
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.portable.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/preview-package
      - name: Verify artifact and serve its exact static output
        env:
          MANIFEST_DIGEST: ${{ needs.portable.outputs.manifest_digest }}
        run: |
          node scripts/preview-artifact.mjs verify "$RUNNER_TEMP/preview-package" "$GITHUB_SHA" "$MANIFEST_DIGEST"
          test ! -e dist
          cp -R "$RUNNER_TEMP/preview-package/dist" dist
      - name: Seven qualified suites with fresh browser profiles
        env:
          BROWSER_REPORT_DIR: ${{ runner.temp }}/browser-ci
        run: node scripts/check-preview-browser-ci.mjs
      - name: Browser diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-ci/
          retention-days: 7
          if-no-files-found: warn

  deploy:
    name: Deploy verified Preview
    needs: [portable, browser]
    # Event guard only; Environment activation is resolved on the runner.
    if: github.event_name == 'push' && github.ref == 'refs/heads/preview'
    environment: preview
    concurrency:
      group: tri-app-preview-publish
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check Preview Environment activation
        id: activation
        shell: bash
        env:
          PREVIEW_AUTO_DEPLOY_ENABLED: ${{ vars.PREVIEW_AUTO_DEPLOY_ENABLED }}
        run: |
          if [ "$PREVIEW_AUTO_DEPLOY_ENABLED" = 'true' ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'Preview publication disabled; no Cloudflare credentials used.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.activation.outputs.enabled == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.activation.outputs.enabled == 'true'
        with:
          node-version: '24.19.0'
      - name: Prepare locked tools before exposing deployment credentials
        if: steps.activation.outputs.enabled == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.activation.outputs.enabled == 'true'
        with:
          artifact-ids: ${{ needs.portable.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/preview-package
      - name: Deploy exact verified package once
        if: steps.activation.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_AUTO_DEPLOY_ENABLED: ${{ vars.PREVIEW_AUTO_DEPLOY_ENABLED }}
          GH_READ_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.portable.outputs.manifest_digest }}
        run: node scripts/deploy-preview-artifact.mjs "$RUNNER_TEMP/preview-package" "$MANIFEST_DIGEST" "$RUNNER_TEMP/preview-deployment"
      - name: Read-only published Preview smoke (no Cloudflare credential)
        if: steps.activation.outputs.enabled == 'true'
        run: node scripts/smoke-preview-ci.mjs "$RUNNER_TEMP/preview-package" "$GITHUB_SHA" "$RUNNER_TEMP/preview-deployment"
      - name: Deployment evidence (including first failure)
        if: always() && steps.activation.outputs.enabled == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preview-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-deployment/
          retention-days: 30
          if-no-files-found: warn
