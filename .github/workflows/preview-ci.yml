# Isolated qualification candidate only; no deployment or Cloudflare secrets.
name: Preview CI
on:
  push:
    branches: [ci/preview-qualification]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    if: github.ref == 'refs/heads/ci/preview-qualification'
    name: Portable verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI_REPORT_DIR: ${{ runner.temp }}/portable-ci
    steps:
      - name: Checkout exact event SHA (PR merge candidate or dispatch SHA)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Feedback release test compares the original migration in Git history.
          fetch-depth: 0
      - name: Install pinned Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.19.0'
      - name: Verify checkout and toolchain
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(node --version)" = 'v24.19.0'
          node --version
          npm --version
          python3 --version
          python3 -c 'import sqlite3; print("SQLite", sqlite3.sqlite_version)'
          git cat-file -e b511238210cba253bd4b90b6b9fdf8b2b2611a9d:migrations/0001_feedback_news.sql
          mkdir -p "$CI_REPORT_DIR"
      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee "$CI_REPORT_DIR/npm-ci.log"
      - name: Portable tests, build, lint and unchanged release gate
        run: node scripts/check-ci-portable.mjs
      - name: Record job outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          CHECKED_SHA: ${{ github.sha }}
        run: |
          printf '\nJob status: %s\n\nEvent SHA: `%s`\n' "$JOB_STATUS" "$CHECKED_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portable-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portable-ci/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
