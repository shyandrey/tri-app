{
  "name": "Preview pipeline qualification",
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "portable": {
      "if": "github.ref == 'refs/heads/ci/preview-pipeline-qualification'",
      "name": "Portable verification",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "outputs": {
        "artifact_id": "${{ steps.package_upload.outputs.artifact-id }}",
        "manifest_digest": "${{ steps.package.outputs.manifest_digest }}"
      },
      "steps": [
        {
          "name": "Initialize CI report directory",
          "shell": "bash",
          "run": "echo \"CI_REPORT_DIR=$RUNNER_TEMP/portable-ci\" >> \"$GITHUB_ENV\"\nmkdir -p \"$RUNNER_TEMP/portable-ci\"\n"
        },
        {
          "name": "Checkout exact event SHA (PR merge candidate or dispatch SHA)",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false,
            "fetch-depth": 0
          }
        },
        {
          "name": "Install pinned Node",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.19.0"
          }
        },
        {
          "name": "Verify checkout and toolchain",
          "shell": "bash",
          "env": {
            "EXPECTED_SHA": "${{ github.sha }}"
          },
          "run": "test \"$(git rev-parse HEAD)\" = \"$EXPECTED_SHA\"\ntest \"$(node --version)\" = 'v24.19.0'\nnode --version\nnpm --version\npython3 --version\npython3 -c 'import sqlite3; print(\"SQLite\", sqlite3.sqlite_version)'\ngit cat-file -e b511238210cba253bd4b90b6b9fdf8b2b2611a9d:migrations/0001_feedback_news.sql\nmkdir -p \"$CI_REPORT_DIR\"\n"
        },
        {
          "name": "Install locked dependencies",
          "shell": "bash",
          "run": "set -o pipefail\nnpm ci --no-audit --no-fund 2>&1 | tee \"$CI_REPORT_DIR/npm-ci.log\"\n"
        },
        {
          "name": "Portable tests, build, lint and unchanged release gate",
          "run": "node scripts/check-ci-portable.mjs"
        },
        {
          "name": "Preview pipeline safety tests",
          "run": "node --test scripts/test-preview-pipeline.mjs"
        },
        {
          "name": "Package the verified build without rebuilding",
          "id": "package",
          "run": "node scripts/preview-artifact.mjs prepare \"${{ runner.temp }}/preview-package\" \"$GITHUB_SHA\""
        },
        {
          "name": "Retain immutable Preview package",
          "id": "package_upload",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "preview-package-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/preview-package/",
            "if-no-files-found": "error",
            "retention-days": 30,
            "include-hidden-files": true
          }
        },
        {
          "name": "Record job outcome",
          "if": "always()",
          "env": {
            "JOB_STATUS": "${{ job.status }}",
            "CHECKED_SHA": "${{ github.sha }}"
          },
          "run": "printf '\\nJob status: %s\\n\\nEvent SHA: `%s`\\n' \"$JOB_STATUS\" \"$CHECKED_SHA\" >> \"$GITHUB_STEP_SUMMARY\"\n"
        },
        {
          "name": "Failure diagnostics only",
          "if": "failure()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "portable-ci-failure-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/portable-ci/",
            "if-no-files-found": "warn",
            "retention-days": 7,
            "include-hidden-files": false
          }
        }
      ]
    },
    "browser": {
      "name": "Browser verification",
      "needs": "portable",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 35,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "ref": "${{ github.sha }}",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "24.19.0"
          }
        },
        {
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "artifact-ids": "${{ needs.portable.outputs.artifact_id }}",
            "merge-multiple": true,
            "path": "${{ runner.temp }}/preview-package"
          }
        },
        {
          "name": "Verify artifact and serve its exact static output",
          "env": {
            "MANIFEST_DIGEST": "${{ needs.portable.outputs.manifest_digest }}"
          },
          "run": "node scripts/preview-artifact.mjs verify \"$RUNNER_TEMP/preview-package\" \"$GITHUB_SHA\" \"$MANIFEST_DIGEST\"\ntest ! -e dist\ncp -R \"$RUNNER_TEMP/preview-package/dist\" dist\n"
        },
        {
          "name": "Artifact-only Wrangler replay, integrity and disabled deployment gate",
          "env": {
            "MANIFEST_DIGEST": "${{ needs.portable.outputs.manifest_digest }}",
            "WRANGLER_SEND_METRICS": "false"
          },
          "shell": "bash",
          "run": "set -euo pipefail\nmkdir -p \"$RUNNER_TEMP/browser-ci\"\nnode --input-type=module <<'JS'\nimport fs from 'node:fs';import path from 'node:path';import assert from 'node:assert/strict';\nimport {assertDeployContext} from './scripts/deploy-preview-artifact.mjs';\nconst root=path.join(process.env.RUNNER_TEMP,'preview-package');\nconst c=JSON.parse(fs.readFileSync(path.join(root,'wrangler.json')));\nassert.equal(c.name,'tri-app-preview');assert.equal(c.build,undefined);\nc.main=path.join(root,'worker/index.js');c.assets.directory=path.join(root,'dist');\nfs.writeFileSync(path.join(process.env.RUNNER_TEMP,'replay-config.json'),JSON.stringify(c));\nassert.throws(()=>assertDeployContext({...process.env,PREVIEW_AUTO_DEPLOY_ENABLED:'false'}));\nassert.throws(()=>assertDeployContext({...process.env,PREVIEW_AUTO_DEPLOY_ENABLED:'true'}));\nconsole.log('Qualification ref and disabled activation fail closed; no credentials supplied.');\nJS\n./node_modules/.bin/wrangler deploy --no-bundle --dry-run --config \"$RUNNER_TEMP/replay-config.json\" --outdir \"$RUNNER_TEMP/replay-worker\" 2>&1 | tee \"$RUNNER_TEMP/browser-ci/artifact-replay.log\"\ncmp \"$RUNNER_TEMP/preview-package/worker/index.js\" \"$RUNNER_TEMP/replay-worker/index.js\"\nnode scripts/preview-artifact.mjs verify \"$RUNNER_TEMP/preview-package\" \"$GITHUB_SHA\" \"$MANIFEST_DIGEST\"\n"
        },
        {
          "name": "Seven qualified suites with fresh browser profiles",
          "env": {
            "BROWSER_REPORT_DIR": "${{ runner.temp }}/browser-ci"
          },
          "run": "node scripts/check-preview-browser-ci.mjs"
        },
        {
          "name": "Browser diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "browser-ci-${{ github.run_id }}-${{ github.run_attempt }}",
            "path": "${{ runner.temp }}/browser-ci/",
            "retention-days": 7,
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "deployment_gate": {
      "name": "Live deployment gate (must skip)",
      "needs": [
        "portable",
        "browser"
      ],
      "if": "github.event_name == 'push' && github.ref == 'refs/heads/preview' && vars.PREVIEW_AUTO_DEPLOY_ENABLED == 'true'",
      "runs-on": "ubuntu-24.04",
      "steps": [
        {
          "run": "echo \"Unexpected gate opening\"; exit 1"
        }
      ]
    }
  },
  "on": {
    "push": {
      "branches": [
        "ci/preview-pipeline-qualification"
      ]
    }
  },
  "concurrency": {
    "group": "preview-pipeline-qualification",
    "cancel-in-progress": false
  }
}
